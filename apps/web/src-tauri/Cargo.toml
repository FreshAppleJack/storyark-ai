[package]
name = "storyark-desktop"
version = "0.1.0"
description = "StoryArk desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "storyark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
fastembed = { version = "6.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
