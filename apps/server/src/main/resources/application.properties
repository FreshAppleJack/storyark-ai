spring.application.name=server
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/StoryArk_SQL?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:${API_KEY:placeholder}}
deepseek.api.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true
spring.devtools.restart.enabled=true

logging.level.io.github.freshapplejack.storyark.mapper=DEBUG
