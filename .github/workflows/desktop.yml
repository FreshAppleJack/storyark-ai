name: Desktop storage checks

on:
  push:
    paths: ['apps/web/src-tauri/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/web/src-tauri/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web/src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
