name: Frontend checks

on:
  push:
    paths: ['apps/web/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - name: SQLite schema contract
        run: node --test scripts/local-storage-schema.test.mjs
      - name: Typecheck and production build
        run: npm run build
